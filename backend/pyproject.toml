[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartstock-backend"
version = "0.1.0"
description = "SmartStock AI backend: FastAPI service, Databricks access, and synthetic retail data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "databricks-sql-connector>=4.0",
    # Arrow result fetching for the Databricks read path. >=22 is the connector's minimum on
    # Python 3.14; <26 keeps fresh installs on the validated 25.x line (installed: 25.0.1).
    "pyarrow>=22.0.0,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
